name: Source integrity and scientific tests
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: environment/requirements.txt
      - run: python -m pip install -r environment/requirements.txt
      - run: python reproduce.py check
      - run: python reproduce.py test
